[platformio]
src_dir = pala_note
default_envs = pala_note_2

[env:pala_note_2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_pala_8MB.csv
board_build.embed_txtfiles =
  certs/pala_ca_bundle.pem
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D PALA_NOTE_VERSION=\"2.0.0-rc93\"

[env:pala_note_bridge]
extends = env:pala_note_2
build_flags =
  ${env:pala_note_2.build_flags}
  -D PALA_RUNTIME_PAIRING=1

[env:pala_note_recorder]
extends = env:pala_note_bridge
build_flags =
  ${env:pala_note_bridge.build_flags}
  -D PALA_RECORDER_FIRST=1

[env:pala_note_recorder_timing]
extends = env:pala_note_recorder
build_flags =
  ${env:pala_note_recorder.build_flags}
  -D PALA_WAV_TIMING=1

[env:pala_note_recorder_stall6500]
extends = env:pala_note_recorder_timing
build_flags =
  ${env:pala_note_recorder_timing.build_flags}
  -D PALA_TEST_FIRST_WRITE_DELAY_MS=6500

[env:pala_note_recorder_qualification]
extends = env:pala_note_recorder_timing
build_flags =
  ${env:pala_note_recorder_timing.build_flags}
  -D PALA_STAGE2_BENCH=1

[env:pala_note_recorder_display_stall6500]
extends = env:pala_note_recorder_qualification
build_flags =
  ${env:pala_note_recorder_qualification.build_flags}
  -D PALA_TEST_FIRST_WRITE_DELAY_MS=6500

[env:pala_note_recorder_storage_stall6500]
extends = env:pala_note_recorder_display_stall6500
build_flags =
  ${env:pala_note_recorder_display_stall6500.build_flags}
  -D PALA_STORAGE_PROBE=1
  -Wl,--wrap=ff_mutex_take
  -Wl,--wrap=_lock_acquire
  -Wl,--wrap=_lock_acquire_recursive
  -Wl,--wrap=__retarget_lock_acquire
  -Wl,--wrap=__retarget_lock_acquire_recursive
  -Wl,--wrap=sdmmc_host_do_transaction
  -Wl,--wrap=sdmmc_host_wait_for_event
  -Wl,--wrap=xQueueSemaphoreTake
  -Wl,--wrap=xTaskPriorityInherit
  -Wl,--wrap=vTaskPlaceOnEventList

[env:pala_note_recorder_vfsowner_stall6500]
extends = env:pala_note_recorder_storage_stall6500
build_flags =
  ${env:pala_note_recorder_storage_stall6500.build_flags}
  -D PALA_VFS_OWNER_TRACE=1
  -Wl,--wrap=xQueueTakeMutexRecursive
  -Wl,--wrap=xQueueGiveMutexRecursive
  -Wl,--wrap=xQueueGenericSend
  -Wl,--wrap=xTaskPriorityDisinherit
  -Wl,--wrap=f_open
  -Wl,--wrap=f_read
  -Wl,--wrap=f_write
  -Wl,--wrap=f_opendir
  -Wl,--wrap=f_readdir
  -Wl,--wrap=f_stat
  -Wl,--wrap=f_close
  -Wl,--wrap=f_closedir
  -Wl,--wrap=f_sync
  -Wl,--wrap=f_lseek
  -Wl,--wrap=f_unlink
  -Wl,--wrap=f_rename
  -Wl,--wrap=f_mkdir
  -Wl,--wrap=f_truncate
  -Wl,--wrap=f_getfree
  -Wl,--wrap=vTaskDelay
  -Wl,--wrap=_open_r
  -Wl,--wrap=_read_r
  -Wl,--wrap=_write_r
  -Wl,--wrap=_close_r
  -Wl,--wrap=_stat_r
  -Wl,--wrap=_fstat_r
  -Wl,--wrap=opendir
  -Wl,--wrap=readdir
  -Wl,--wrap=closedir
  -Wl,--wrap=fdopen
  -Wl,--wrap=setvbuf
  -Wl,--wrap=fwrite

[env:pala_note_recorder_msc]
extends = env:pala_note_recorder_vfsowner_stall6500
build_flags =
  ${env:pala_note_recorder_vfsowner_stall6500.build_flags}
  -D PALA_USB_CARD_SERVICE=1

[env:pala_note_recorder_wifi_trace]
extends = env:pala_note_recorder_msc
build_flags =
  ${env:pala_note_recorder_msc.build_flags}
  -D PALA_WIFI_TRIAL=1

[env:pala_note_recorder_msc_ble_paced]
extends = env:pala_note_recorder_msc
build_flags =
  ${env:pala_note_recorder_msc.build_flags}
  -D PALA_TEST_BLE_FRAGMENT_GAP_MS=180

[env:pala_note_workspace_calendar]
extends = env:pala_note_recorder
build_flags =
  ${env:pala_note_recorder.build_flags}
  -D PALA_WORKSPACE_CALENDAR=1

[env:pala_note_stage3]
extends = env:pala_note_workspace_calendar
build_flags =
  ${env:pala_note_workspace_calendar.build_flags}
  -D PALA_STAGE3=1

[env:pala_note_stage3_trial]
extends = env:pala_note_stage3
build_flags =
  ${env:pala_note_stage3.build_flags}
  -D PALA_STAGE3_TRIAL=1
  -D PALA_WAV_TIMING=1
  -D PALA_STAGE2_BENCH=1
  -D PALA_USB_CARD_SERVICE=1
