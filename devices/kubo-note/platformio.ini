[platformio]
src_dir = pala_note
default_envs = pala_note_2

[env:pala_note_2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_pala_8MB.csv
board_build.embed_txtfiles =
  certs/pala_ca_bundle.pem
lib_deps =
  adafruit/Adafruit GFX Library@1.12.1
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D PALA_NOTE_VERSION=\"2.0.0-rc84\"

[env:pala_note_bridge]
extends = env:pala_note_2
build_flags =
  ${env:pala_note_2.build_flags}
  -D PALA_RUNTIME_PAIRING=1
